name: Context compatibility

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  context:
    name: Context on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    env:
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned uv
        run: python -m pip install --disable-pip-version-check uv==0.12.2
      - name: Sync the requested supported interpreter
        run: uv sync --locked --all-groups --python "${{ matrix.python }}"
      - name: Prove context diagnostics on the requested interpreter
        run: |
          uv run --python "${{ matrix.python }}" python --version
          uv run --python "${{ matrix.python }}" pytest tests/test_context.py tests/test_context_path_compat.py -q
