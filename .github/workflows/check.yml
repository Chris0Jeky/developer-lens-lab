name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  prove:
    name: Prove the lab
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.12.2
      - name: Prove the runtime-only CLI install
        run: uv run --isolated --no-dev --locked dllab doctor --json
      - name: Sync locked environment
        run: uv sync --locked --all-groups
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run pyright
      - name: Verify context
        run: uv run dllab context verify
      - name: Check generated programme and contracts
        run: |
          uv run dllab tasks check
          uv run dllab contracts check
      - name: Test
        run: uv run pytest --cov=developer_lens_lab --cov-report=term-missing
      - name: Reproduce the WB-C1 smoke benchmark
        run: |
          uv run dllab benchmark wb-c1 --smoke
          uv run dllab run reproduce wbc1_smoke
          uv run dllab report build wbc1_smoke
      - name: Build documentation
        run: uv run mkdocs build --strict
      - name: Verify repository hygiene
        run: uv run python scripts/verify_hygiene.py
      - name: Check whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            git diff --check "$BASE_SHA...HEAD"
          else
            git diff --check HEAD^...HEAD
          fi
