name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  prove:
    name: Prove the lab
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.12.2
      - name: Sync locked environment
        run: uv sync --locked --all-groups
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run pyright
      - name: Verify context
        run: uv run dllab context verify
      - name: Test
        run: uv run pytest --cov=developer_lens_lab --cov-report=term-missing
      - name: Build documentation
        run: uv run mkdocs build --strict
      - name: Verify repository hygiene
        run: uv run python scripts/verify_hygiene.py
      - name: Check whitespace
        run: git diff --check
